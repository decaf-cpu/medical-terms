<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self' data:; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; script-src 'self'; connect-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="대한의사협회 의학용어집 기반 의학용어 실시간 검색">
    <title>의학용어 검색</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="assets/style.css?v=20261120-1">
</head>
<body>
    <div class="container">
        <div class="header">
                        <button id="themeToggle" class="icon-btn theme-toggle" type="button" aria-label="다크모드 전환" title="다크모드 전환">
                <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5Z" fill="currentColor"/>
                </svg>
                <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Zm0-16v2m0 16v2m10-10h-2M4 12H2m15.07-7.07-1.41 1.41M8.34 15.66l-1.41 1.41m10.14 0-1.41-1.41M8.34 8.34 6.93 6.93" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
<h1> 의학용어 검색</h1>
            <p>용어 또는 뜻풀이로 검색하세요. 대소문자를 구분하지 않습니다.</p>
            <div class="version-info" id="versionInfo">
                데이터 불러오는 중…
            </div>
        </div>

        <div class="search-box">
            <div class="search-input-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="검색어를 입력해 주세요."
                    autofocus
                >
                <button id="clearBtn" class="clear-btn" type="button" aria-label="검색어 지우기" title="검색어 지우기" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
                <button id="searchBtn" class="search-icon" type="button" aria-label="검색" title="검색"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
            <div class="stats">
                <span id="totalCount">&nbsp;</span>
                <span id="resultCount"></span>
            </div>
        </div>

        <div class="results" id="results">
            <div class="no-results">
                <div class="no-results-icon"></div>
                <div>용어 데이터를 불러오는 중입니다…</div>
            </div>
        </div>
    </div>

    <script src="assets/app.js?v=20261120-1" defer></script>
</body>
</html>
